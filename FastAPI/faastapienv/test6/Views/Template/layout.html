<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="{{ url_for('static', path='CSS/style.css') }}">
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

    <title>ecoFacility</title>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-info shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold fs-4" href="#">ecoFacility</a>

    <!-- Center search bar -->
   <!-- search bar (kept) -->
<div class="d-flex mx-auto w-50 position-relative">
  <input class="form-control" id="search" placeholder="Search">

  <!-- live results -->
  <div id="searchResults"
       class="list-group position-absolute top-100 start-0 w-100 z-3
              bg-white border border-secondary rounded-1 shadow-sm">
       <!-- JS fills rows here -->
  </div>
</div>
    <!-- Login block -->
    <div class="d-flex">
      <input class="form-control me-2" id="user" placeholder="username" required>
      <input class="form-control me-2" id="pwd" type="password" placeholder="password" required>
      <button class="btn btn-outline-dark" id="loginBtn">Login</button>
    </div>
  </div>
</nav>

    {% block content %}

    {% endblock %}
</body>
</html>
<script src="{{ url_for('static', path='JS/ajax.js') }}" defer></script>
