<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="{{ url_for('static', path='CSS/style.css') }}">
    <script src="{{ url_for('static', path='JS/ajax.js') }}" defer></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

    <title>ecoFacility</title>
    <script defer src="{{ url_for('static', path='JS/ajax.js') }}"></script>
<script defer>
document.addEventListener('DOMContentLoaded', function () {
  const btn = document.getElementById('loginBtn');
  const token = localStorage.getItem('token');

  if (token) {                 // token survived the refresh
    btn.textContent = 'Logout';
    btn.dataset.state = 'logout';
  }
});
</script>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-info shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold fs-4" href="#">ecoFacility</a>
    <div class="d-flex ms-auto gap-2">
      <input class="form-control" id="user" placeholder="username">
      <input class="form-control" id="pwd" type="password" placeholder="password">
      <button class="btn btn-outline-dark" id="loginBtn" data-state="login">Login</button>
    </div>
  </div>
</nav>
    {% block content %}

    {% endblock %}
</body>
</html>
