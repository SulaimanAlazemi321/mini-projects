{% extends 'Template/layout.html' %}

{% block content %}


<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light py-5">
    <div class="card shadow-lg border-0" style="width: 100%; max-width: 600px;">
      <div class="card-body p-5">
        <!-- Form Header -->
        <div class="text-center mb-4">
          <div class="mb-3">
            <i class="bi bi-pencil-square text-warning" style="font-size: 3rem;"></i>
          </div>
          <h2 class="text-warning fw-bold mb-2">Edit Eco-Facility</h2>
          <p class="text-muted">Update facility information</p>
        </div>
  
        <!-- Edit Facility Form -->
        <form id="editFacilityForm">
          <input type="hidden" id="facilityId" value="{{ facility.id }}">
          
          <!-- Facility Basic Information -->
          <div class="mb-4">
            <h5 class="text-warning mb-3">
              <i class="bi bi-building me-2"></i>
              Facility Information
            </h5>
            
            <div class="mb-3">
              <label for="facilityTitle" class="form-label fw-semibold">
                <i class="bi bi-tag me-2"></i>Facility Title
              </label>
              <input 
                type="text" 
                class="form-control" 
                id="facilityTitle" 
                value="{{ facility.title }}"
                placeholder="Enter facility name"
                required
              >
            </div>
  
            <div class="mb-3">
              <label for="facilityCategory" class="form-label fw-semibold">
                <i class="bi bi-grid me-2"></i>Category
              </label>
              <select class="form-control" id="facilityCategory" required>
                <option value="">Select a category</option>
                {% for category in categories %}
                <option value="{{ category.id }}" {% if category.id == facility.category %}selected{% endif %}>
                  {{ category.name }}
                </option>
                {% endfor %}
              </select>
            </div>
  
            <div class="mb-3">
              <label for="facilityDescription" class="form-label fw-semibold">
                <i class="bi bi-file-text me-2"></i>Description
              </label>
              <textarea 
                class="form-control" 
                id="facilityDescription" 
                rows="4" 
                placeholder="Describe the facility and its eco-friendly features"
                required
              >{{ facility.description }}</textarea>
            </div>
          </div>
  
          <!-- Location Information -->
          <div class="mb-4">
            <h5 class="text-warning mb-3">
              <i class="bi bi-geo-alt me-2"></i>
              Location Details
            </h5>
            
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="houseNumber" class="form-label fw-semibold">
                    <i class="bi bi-house-door me-2"></i>House Number
                  </label>
                  <input 
                    type="text" 
                    class="form-control" 
                    id="houseNumber" 
                    value="{{ facility.houseNumber }}"
                    placeholder="e.g., 123"
                    required
                  >
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="streetName" class="form-label fw-semibold">
                    <i class="bi bi-signpost me-2"></i>Street Name
                  </label>
                  <input 
                    type="text" 
                    class="form-control" 
                    id="streetName" 
                    value="{{ facility.streetName }}"
                    placeholder="e.g., Main Street"
                    required
                  >
                </div>
              </div>
            </div>
  
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="town" class="form-label fw-semibold">
                    <i class="bi bi-building me-2"></i>Town/City
                  </label>
                  <input 
                    type="text" 
                    class="form-control" 
                    id="town" 
                    value="{{ facility.town }}"
                    placeholder="e.g., London"
                    required
                  >
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="postcode" class="form-label fw-semibold">
                    <i class="bi bi-mailbox me-2"></i>Postcode
                  </label>
                  <input 
                    type="text" 
                    class="form-control" 
                    id="postcode" 
                    value="{{ facility.postcode }}"
                    placeholder="e.g., SW1A 1AA"
                    required
                  >
                </div>
              </div>
            </div>
  
            <div class="mb-3">
              <label for="county" class="form-label fw-semibold">
                <i class="bi bi-map me-2"></i>County
              </label>
              <input 
                type="text" 
                class="form-control" 
                id="county" 
                value="{{ facility.county }}"
                placeholder="e.g., Greater London"
                required
              >
            </div>
          </div>
  
          <!-- Coordinates -->
          <div class="mb-4">
            <h5 class="text-warning mb-3">
              <i class="bi bi-compass me-2"></i>
              GPS Coordinates
            </h5>
            
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="latitude" class="form-label fw-semibold">
                    <i class="bi bi-geo me-2"></i>Latitude
                  </label>
                  <input 
                    type="number" 
                    step="any"
                    class="form-control" 
                    id="latitude" 
                    value="{{ facility.lat }}"
                    placeholder="e.g., 51.5074"
                    required
                  >
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="longitude" class="form-label fw-semibold">
                    <i class="bi bi-geo me-2"></i>Longitude
                  </label>
                  <input 
                    type="number" 
                    step="any"
                    class="form-control" 
                    id="longitude" 
                    value="{{ facility.lng }}"
                    placeholder="e.g., -0.1278"
                    required
                  >
                </div>
              </div>
            </div>
          </div>
  
          <!-- Submit Buttons -->
          <div class="row">
            <div class="col-md-6">
              <button type="submit" class="btn btn-warning btn-lg w-100 mb-3">
                <i class="bi bi-save me-2"></i>
                Update Facility
              </button>
            </div>
            <div class="col-md-6">
              <a href="/" class="btn btn-secondary btn-lg w-100 mb-3">
                <i class="bi bi-x-circle me-2"></i>
                Cancel
              </a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

{% endblock %}
