{% extends "Template/layout.html" %}

{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="card shadow-lg border-0" style="width: 100%; max-width: 400px;">
    <div class="card-body p-5">
      <!-- Login Header -->
      <div class="text-center mb-4">
        <div class="mb-3">
          <i class="bi bi-shield-lock text-success" style="font-size: 3rem;"></i>
        </div>
        <h2 class="text-success fw-bold mb-2">Welcome Back</h2>
        <p class="text-muted">Sign in to access your eco-facility dashboard</p>
      </div>

      <!-- Login Form -->
      <form id="userFormlogin">
        <div class="mb-3">
          <label for="usrname" class="form-label fw-semibold">
            <i class="bi bi-person me-2"></i>Username
          </label>
          <input 
            type="text" 
            class="form-control form-control-lg" 
            id="usrname" 
            placeholder="Enter your username"
            required
          >
        </div>

        <div class="mb-4">
          <label for="passwd" class="form-label fw-semibold">
            <i class="bi bi-lock me-2"></i>Password
          </label>
          <input 
            type="password" 
            class="form-control form-control-lg" 
            id="passwd" 
            placeholder="Enter your password"
            required
          >
        </div>

        <button type="submit" class="btn btn-success btn-lg w-100 mb-3">
          <i class="bi bi-box-arrow-in-right me-2"></i>
          Sign In
        </button>
      </form>

      <!-- Login Footer -->
      <div class="text-center">
        <p class="mb-0 text-muted small">
          Welcome to ecoFacility - Discover sustainable facilities
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
