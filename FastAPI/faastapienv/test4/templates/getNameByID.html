{% extends 'layout.html' %}
{% block content %}
<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="card-title mb-4">Search Name by ID</h4>
      <form method="POST" id="nameByIDForm">
        <div class="mb-3">
          <label for="ID" class="form-label">Enter ID</label>
          <input type="text" class="form-control" id="ID" placeholder="e.g. 123">
        </div>
        <button type="submit" class="btn btn-primary w-100">Search</button>
      </form>

      <hr>
      <div class="mt-3">
        <h5 class="text-muted">Result:</h5>
        <h2 id="nameByIdResualt" class="text-success"></h2>
      </div>
    </div>
  </div>

  {% if people %}
    <div class="card mt-4">
      <div class="card-body">
        <h5 class="card-title">People Found:</h5>
        <ul class="list-group">
          {% for person in people %}
            <li class="list-group-item">{{ person.name }}</li>
          {% endfor %}
        </ul>
      </div>
    </div>
  {% endif %}
</div>
{% endblock %}
