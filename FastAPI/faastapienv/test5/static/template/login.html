{% extends "layout.html" %}

{% block title %}Designer Login | Royal Couture{% endblock %}

{% block content %}
<section class="w-full flex flex-col items-center py-24">
  <div class="relative w-full max-w-md glass rounded-3xl px-10 py-12 shadow-xl">

    {% if error %}
      <div class="mb-6 rounded-lg bg-red-100 text-red-800 p-3 text-sm text-center">
        ⚠️ Invalid credentials
      </div>
    {% endif %}

    <h1 class="text-3xl font-playfair font-bold text-center text-[var(--royal-purple)] mb-8">
      Designer Login
    </h1>

    <form action="/customer/login" method="post" class="space-y-6">
      <div>
        <label for="email" class="block mb-1 font-medium text-[var(--royal-purple)]">Email</label>
        <input id="email" name="email" type="email" required
               class="w-full rounded-lg border-purple-200 focus:border-purple-400 focus:ring-purple-400">
      </div>

      <div>
        <label for="password" class="block mb-1 font-medium text-[var(--royal-purple)]">Password</label>
        <input id="password" name="password" type="password" required
               class="w-full rounded-lg border-purple-200 focus:border-purple-400 focus:ring-purple-400">
      </div>

      <button type="submit" class="luxury-btn w-full py-3 text-lg">Sign In</button>
    </form>
  </div>
</section>
{% endblock %}
